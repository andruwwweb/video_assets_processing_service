name: mpp

# Local development infrastructure.
# All values come from .env (see .env.example) — no defaults here.
# The `pnpm infra:*` scripts pass `--env-file .env`.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot init: creates the bucket. Loops until MinIO is up, so it doesn't depend on healthcheck.
  createbuckets:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_USER: ${S3_ACCESS_KEY_ID}
      MINIO_PASS: ${S3_SECRET_ACCESS_KEY}
      BUCKET: ${S3_BUCKET}
    entrypoint: >-
      /bin/sh -c "until mc alias set local http://minio:9000 $$MINIO_USER $$MINIO_PASS; do echo waiting-for-minio; sleep 2; done; mc mb --ignore-existing local/$$BUCKET; mc anonymous set download local/$$BUCKET; echo bucket-ready"

  # Media worker — runs in Docker for FFmpeg. Reaches infra by service name.
  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      API_PORT: ${API_PORT}
      API_HOST: ${API_HOST}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED}
      DEV_ACCOUNT_ID: ${DEV_ACCOUNT_ID}
      # Service-name hosts (container view), assembled from the same discrete .env vars.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE}
      PRESIGN_PUT_TTL_SECONDS: ${PRESIGN_PUT_TTL_SECONDS}
      PRESIGN_GET_TTL_SECONDS: ${PRESIGN_GET_TTL_SECONDS}
      PROBE_TIMEOUT_MS: ${PROBE_TIMEOUT_MS}
      TRANSCODE_TIMEOUT_MS: ${TRANSCODE_TIMEOUT_MS}

volumes:
  postgres_data:
  redis_data:
  minio_data:
